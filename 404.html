<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="0; url=/" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#5041D2" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
<title>الصفحة غير موجودة — Marça</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/theme.css?v=1" />
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:linear-gradient(135deg,#fff,var(--accent-tint));display:grid;place-items:center;padding:1.25rem;text-align:center}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:2rem 1.75rem;width:min(100%,420px)}
img{width:48px;height:48px;border-radius:12px;margin:0 auto 1rem;display:block}
h1{font-size:1.4rem;margin-bottom:.5rem}p{color:var(--text-muted);margin-bottom:1.25rem}
a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:var(--radius-pill);padding:.7rem 1.6rem}
a:hover{background:var(--accent-bright)}
</style>
</head>
<body>
<main class="card"><img src="/assets/logo-mark.png" alt="" width="48" height="48" /><h1>الصفحة غير موجودة</h1><p>جارٍ تحويلك إلى الصفحة الرئيسية…</p><a href="/">الرئيسية</a></main>
</body>
</html>
