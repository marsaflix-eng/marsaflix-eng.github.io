name: Sync storefront from marca-online-store
on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-storefront]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull public site files and commit
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/marsaflix-eng/marca-online-store/main"
          for f in index.html 404.html robots.txt css/styles.css js/app.js js/config.js js/config.json; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$base/$f" -o "$f"
            echo "fetched $f $(wc -c < "$f") bytes"
          done
          # Prefer punycode CNAME for GitHub
          printf '%s\n' 'xn--mara-2oa.online' > CNAME
          : > .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else git commit -m "Sync Marça storefront from marca-online-store" && git push; fi
