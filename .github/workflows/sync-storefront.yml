name: Sync storefront from marca-online-store
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Disabled. Live site is no longer overwritten from the old repo."
        required: true
        type: string
permissions:
  contents: read
jobs:
  sync:
    if: github.event.inputs.confirm == 'SYNC'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse overwrite
        run: |
          echo "Live storefront sync is disabled so it cannot replace the published site."
          exit 1
