<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>صيانة — Marça</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #fff; color: #111; font-family: "Red Hat Display", Arial, sans-serif; }
    main { width: min(100%, 32rem); text-align: center; }
    .logo { margin: 0 0 1.4rem; font-weight: 700; letter-spacing: .12em; font-size: 1.4rem; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 700; }
    p { margin: 1rem 0 0; color: #111; font-size: 1.15rem; }
  </style>
</head>
<body>
  <main>
    <p class="logo">MARÇA</p>
    <h1>صيانة</h1>
    <p>نحدّث الموقع قريباً.</p>
  </main>
</body>
</html>
