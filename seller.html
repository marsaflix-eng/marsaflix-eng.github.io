<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f9fafb">
  <title>صيانة — Marça</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700&display=swap">
  <style>
    :root { color-scheme: light; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f9fafb; --card:#fff; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100vh; background:var(--bg); color:var(--ink); font-family:"Red Hat Display", Arial, sans-serif; }
    header { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 1.5rem; background:#fff; border-bottom:1px solid var(--line); }
    .logo { font-weight:700; letter-spacing:.08em; font-size:1.35rem; color:var(--ink); text-decoration:none; }
    .nav { display:flex; gap:1.2rem; color:#374151; font-size:.95rem; }
    main { min-height:calc(100vh - 72px); display:grid; place-items:center; padding:2rem 1rem 3rem; }
    .card { width:min(100%, 42rem); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:clamp(2rem, 6vw, 3.5rem) 1.5rem; text-align:center; box-shadow:0 10px 30px rgba(17,24,39,.04); }
    .brand { margin:0 0 1rem; color:#6d28d9; font-size:.8rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.6rem, 8vw, 4.4rem); font-weight:700; letter-spacing:-.03em; }
    .rule { width:3rem; height:3px; margin:1.2rem auto; border-radius:99px; background:#7c3aed; }
    p { margin:0; color:var(--muted); font-size:1.15rem; line-height:1.8; }
    .trust { display:flex; flex-wrap:wrap; justify-content:center; gap:.6rem; margin-top:1.6rem; }
    .trust span { border:1px solid var(--line); border-radius:999px; padding:.4rem .8rem; color:#374151; font-size:.85rem; background:#fff; }
    footer { text-align:center; color:#9ca3af; font-size:.85rem; padding:0 1rem 1.5rem; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/" aria-label="Marça">MARÇA</a>
    <div class="nav" aria-hidden="true"><span>المتجر</span><span>الطلبات</span></div>
  </header>
  <main>
    <section class="card" aria-labelledby="maintenance-title">
      <div class="brand">Marça online</div>
      <h1 id="maintenance-title">صيانة</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>نحدّث الموقع قريباً.</p>
      <div class="trust"><span>دفع آمن</span><span>تسليم رقمي</span><span>دعم عبر واتساب</span></div>
    </section>
  </main>
  <footer>MARÇA</footer>
</body>
</html>
