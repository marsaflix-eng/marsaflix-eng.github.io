<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c0b09">
  <title>صيانة — Marça</title>
  <style>
    :root { color-scheme: dark; --ink:#0c0b09; --gold:#d5ad63; --cream:#f3ead8; --muted:#b7aa95; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { display:grid; place-items:center; min-height:100vh; padding:2rem; overflow:hidden; color:var(--cream); background:var(--ink); font-family: Georgia, "Times New Roman", serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.42; background:radial-gradient(circle at 50% 36%, rgba(213,173,99,.14), transparent 38%), linear-gradient(135deg, transparent 49.8%, rgba(213,173,99,.09) 50%, transparent 50.2%); }
    .card { position:relative; width:min(100%, 40rem); padding:clamp(2.8rem, 8vw, 5rem) clamp(1.5rem, 7vw, 4rem); text-align:center; border:1px solid rgba(213,173,99,.42); background:linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); box-shadow:0 1.5rem 5rem rgba(0,0,0,.34), inset 0 0 0 7px rgba(213,173,99,.035); }
    .mark { display:inline-grid; place-items:center; width:4rem; height:4rem; margin-bottom:1.8rem; border:1px solid var(--gold); border-radius:50%; color:var(--gold); font-size:1.8rem; line-height:1; }
    .brand { margin:0 0 1.8rem; color:var(--gold); font-size:.78rem; letter-spacing:.32em; text-transform:uppercase; }
    h1 { margin:0; color:var(--cream); font-size:clamp(3rem, 12vw, 5.3rem); font-weight:400; line-height:1.1; }
    .rule { width:4.5rem; height:1px; margin:1.6rem auto; background:var(--gold); opacity:.75; }
    p { margin:0; color:var(--muted); font-size:clamp(1.05rem, 3vw, 1.25rem); line-height:2; }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="maintenance-title">
    <div class="mark" aria-hidden="true">م</div>
    <div class="brand">Marça online</div>
    <h1 id="maintenance-title">صيانة</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>نحدّث الموقع قريباً.</p>
  </main>
</body>
</html>
