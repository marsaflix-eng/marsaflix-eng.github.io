<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://marca-affiliate.marsaflix.workers.dev; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" />
  <meta name="theme-color" content="#0c0b09" />
  <title>إدارة الشركاء — Marça</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/checkout.css" />
  <link rel="stylesheet" href="css/affiliate.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="Marça">
        <img class="logo-mark" src="assets/logo-m.svg" width="40" height="40" alt="" />
        <span class="logo-word">Marça Admin</span>
      </a>
    </div>
  </header>
  <main class="aff-wrap" style="padding:1.5rem 1.25rem 3rem;max-width:720px;">
    <div class="aff-card" id="login-card">
      <h2>دخول الإدارة</h2>
      <div class="aff-field"><label for="admin-pass">كلمة المرور</label><input id="admin-pass" type="password" autocomplete="current-password" dir="ltr" /></div>
      <button type="button" class="btn btn-primary" id="btn-admin-login" style="width:100%;">دخول</button>
      <p class="aff-msg" id="login-msg" role="alert"></p>
    </div>
    <div id="admin-dash" class="hidden">
      <div class="aff-card">
        <h2>إحصاءات</h2>
        <pre id="stats" style="direction:ltr;text-align:left;font-size:.8rem;color:var(--text-muted);white-space:pre-wrap;"></pre>
        <button type="button" class="btn btn-ghost" id="btn-refresh" style="width:100%;margin-top:.5rem;">تحديث</button>
        <button type="button" class="btn btn-ghost" id="btn-admin-logout" style="width:100%;margin-top:.5rem;">خروج</button>
      </div>
      <div class="aff-card">
        <h2>البائعون (معلّقون)</h2>
        <ul class="aff-list" id="sellers-list"></ul>
        <div id="setup-token-box" class="token-once hidden"></div>
      </div>
      <div class="aff-card">
        <h2>طلبات معلّقة</h2>
        <ul class="aff-list" id="orders-list"></ul>
      </div>
      <div class="aff-card">
        <h2>عمولات بانتظار الموافقة</h2>
        <ul class="aff-list" id="comms-list"></ul>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
