<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>صيانة — Marça</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; font-family: Arial, sans-serif; }
    main { text-align: center; }
    .logo { margin: 0 0 1rem; letter-spacing: .14em; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 700; }
    p { margin: .8rem 0 0; font-size: 1.15rem; }
  </style>
</head>
<body>
  <main>
    <p class="logo">MARÇA</p>
    <h1>صيانة</h1>
    <p>نحدّث الموقع قريباً.</p>
  </main>
</body>
</html>
